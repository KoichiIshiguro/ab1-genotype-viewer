# Apache vhost (HTTP) — ab1-snp.app.saltybullet.com → 静的ファイル /var/www/ab1-snp.app.saltybullet.com
# 設置: sudo bash /var/www/ab1-snp.app.saltybullet.com/deploy/setup-vhost.sh
<VirtualHost *:80>
    ServerName ab1-snp.app.saltybullet.com
    DocumentRoot /var/www/ab1-snp.app.saltybullet.com

    <Directory /var/www/ab1-snp.app.saltybullet.com>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # 配布対象外のディレクトリは出さない
    <DirectoryMatch "^/var/www/ab1-snp\.app\.saltybullet\.com/(\.git|deploy)">
        Require all denied
    </DirectoryMatch>

    AddDefaultCharset UTF-8
    AddType image/svg+xml .svg

    # 転送量削減（表示速度＝SEO評価に効く）
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml
        AddOutputFilterByType DEFLATE application/javascript application/json application/xml image/svg+xml
    </IfModule>

    <IfModule mod_headers.c>
        # HTMLは更新を早く反映、静的アセットは長めにキャッシュ
        <FilesMatch "\.(html|xml|txt)$">
            Header set Cache-Control "public, max-age=300, must-revalidate"
        </FilesMatch>
        <FilesMatch "\.(js|css|png|svg|ico|webp)$">
            Header set Cache-Control "public, max-age=604800"
        </FilesMatch>

        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
        # AB1データを外部へ出さないことをブラウザ側でも担保する
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/ab1-snp-error.log
    CustomLog ${APACHE_LOG_DIR}/ab1-snp-access.log combined
</VirtualHost>
